spring.application.name=preptrack-backend

# Railway provides PORT automatically
server.port=${PORT:8081}

# Railway MySQL
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# SQL initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Preparation data
preptrack.seed-company-data=true
preptrack.seed-general-preparation=false
preptrack.seed-roadmaps=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000